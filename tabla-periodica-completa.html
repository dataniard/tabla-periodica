<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="title">Tabla Periódica Interactiva</title>
  <style>
:root {
  --fondo: #0f172a;
  --panel: #1e293b;
  --texto: #e2e8f0;
  --muted: #94a3b8;
  --acento: #38bdf8;
  --no-metal: #22c55e;
  --gas-noble: #a78bfa;
  --metal-alcalino: #ef4444;
  --alcalinoterreo: #f97316;
  --metaloide: #eab308;
  --halogeno: #06b6d4;
  --metal-transicion: #60a5fa;
  --metal-postransicion: #94a3b8;
  --lantanido: #f472b6;
  --actinido: #fb7185;
}
* { box-sizing: border-box; }
body {
  margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  background: var(--fondo); color: var(--texto); min-height: 100vh;
}
.topbar {
  display: flex; justify-content: space-between; align-items: flex-start;
  gap: 1rem; padding: 1rem 1.5rem;
  background: linear-gradient(135deg, #0f172a, #1e3a5f);
  border-bottom: 1px solid #334155; position: sticky; top: 0; z-index: 10;
}
.brand h1 { margin: 0; font-size: 1.5rem; }
.subtitle { margin: 0.25rem 0 0; color: var(--muted); }
.lang-wrap { display: flex; align-items: center; gap: 0.4rem; }
.lang-wrap select, .controls select, .controls input, .controls button {
  background: var(--panel); color: var(--texto);
  border: 1px solid #475569; border-radius: 8px; padding: 0.5rem 0.7rem;
}
.controls { display: flex; flex-wrap: wrap; gap: 0.5rem; padding: 1rem 1.5rem; align-items: center; }
.controls input { flex: 1; min-width: 200px; }
.controls button { cursor: pointer; }
.controls button:hover { border-color: var(--acento); }
.contador { color: var(--muted); font-size: 0.9rem; }
.leyenda { display: flex; flex-wrap: wrap; gap: 0.4rem; padding: 0 1.5rem; }
.chip {
  font-size: 0.75rem; padding: 0.25rem 0.6rem; border-radius: 999px;
  border: 1px solid #475569; cursor: pointer; background: var(--panel);
}
.chip.activo { outline: 2px solid var(--acento); }
main { padding: 1rem 1.5rem 2rem; }
.tabla {
  display: grid; grid-template-columns: repeat(18, minmax(52px, 1fr));
  gap: 5px; overflow-x: auto; padding-bottom: 0.5rem;
}
.elemento {
  border-radius: 8px; padding: 6px 4px; text-align: center; cursor: pointer;
  border: 1px solid rgba(255,255,255,0.15); min-height: 66px;
  display: flex; flex-direction: column; justify-content: center;
  transition: transform 0.12s, box-shadow 0.12s; color: #0f172a; font-weight: 600;
}
.elemento:hover, .elemento:focus { transform: scale(1.08); box-shadow: 0 0 0 2px var(--acento); z-index: 2; }
.elemento .num { font-size: 0.65rem; font-weight: 400; opacity: 0.8; }
.elemento .sim { font-size: 1.05rem; font-weight: 800; }
.elemento .nom { font-size: 0.6rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.elemento.seleccionado { outline: 3px solid #fff; }
.elemento.atenuado { opacity: 0.15; filter: grayscale(1); pointer-events: none; }
.fam-no-metal { background: var(--no-metal); }
.fam-gas-noble { background: var(--gas-noble); }
.fam-metal-alcalino { background: var(--metal-alcalino); color: #fff; }
.fam-alcalinoterreo { background: var(--alcalinoterreo); }
.fam-metaloide { background: var(--metaloide); }
.fam-halogeno { background: var(--halogeno); }
.fam-metal-transicion { background: var(--metal-transicion); }
.fam-metal-postransicion { background: var(--metal-postransicion); }
.fam-lantanido { background: var(--lantanido); }
.fam-actinido { background: var(--actinido); color: #fff; }
.bloque-f { margin-top: 1rem; display: grid; gap: 6px; }
.fila-f { display: flex; gap: 8px; align-items: stretch; }
.etiqueta-f { color: var(--muted); font-size: 0.75rem; width: 52px; display: flex; align-items: center; }
.fila-elementos { display: grid; grid-template-columns: repeat(15, minmax(52px, 1fr)); gap: 5px; flex: 1; }
.modal {
  position: fixed; inset: 0; background: rgba(2,6,23,0.7);
  display: flex; align-items: center; justify-content: center; padding: 1rem; z-index: 50;
}
.modal.oculto { display: none; }
.tarjeta-detalle {
  background: var(--panel); border: 1px solid #475569; border-radius: 16px;
  max-width: 480px; width: 100%; padding: 1.5rem; position: relative;
  animation: entrar 0.18s ease-out;
}
@keyframes entrar { from { transform: translateY(12px); opacity: 0; } }
.cerrar {
  position: absolute; top: 0.6rem; right: 0.6rem; background: transparent;
  border: none; color: var(--texto); font-size: 1.1rem; cursor: pointer;
}
.detalle-head { display: flex; gap: 1rem; align-items: center; }
.d-simbolo {
  font-size: 2.5rem; font-weight: 900; width: 90px; height: 90px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 14px; background: var(--acento); color: #082f49;
}
.d-numero { color: var(--muted); }
.detalle-head h2 { margin: 0; }
.d-fam { margin: 0.2rem 0 0; color: var(--muted); font-size: 0.9rem; }
.detalle-lista { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; margin: 1rem 0 0; }
.detalle-lista > div { background: #0f172a; border-radius: 10px; padding: 0.6rem; }
.detalle-lista .ancho { grid-column: 1 / -1; }
.detalle-lista dt { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; }
.detalle-lista dd { margin: 0.2rem 0 0; }
.d-cur { margin-top: 0.35rem; }
.d-wiki { display: inline-block; margin-top: 0.45rem; color: var(--acento); font-size: 0.9rem; }
footer { padding: 1rem 1.5rem 2rem; color: var(--muted); }
/* ===== MODO JUEGO ===== */
.oculto { display: none !important; }
.topbar-right { display: flex; align-items: center; gap: 1rem; }
.switch { display: inline-flex; align-items: center; gap: 0.5rem; cursor: pointer; user-select: none; }
.switch input { position: absolute; opacity: 0; width: 0; height: 0; }
.switch input:focus-visible + .slider { outline: 2px solid var(--acento); outline-offset: 2px; }
.slider { position: relative; width: 44px; height: 24px; border-radius: 999px; background: #475569; border: 1px solid #64748b; transition: background 0.2s; flex: none; }
.slider::before { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform 0.2s; }
.switch input:checked + .slider { background: var(--acento); border-color: var(--acento); }
.switch input:checked + .slider::before { transform: translateX(20px); }
.switch-label { font-size: 0.9rem; font-weight: 600; }
.game-bar { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; padding: 0.7rem 1.5rem; background: #0b2540; border-bottom: 1px solid #334155; }
.game-bar button { background: var(--panel); color: var(--texto); border: 1px solid #475569; border-radius: 8px; padding: 0.5rem 0.8rem; cursor: pointer; }
.game-bar button:hover { border-color: var(--acento); }
.g-score { font-size: 0.9rem; background: var(--panel); border: 1px solid #334155; border-radius: 999px; padding: 0.25rem 0.7rem; }
body.game-on .controls, body.game-on .leyenda { display: none; }
.elemento.juego-oculto { background: var(--panel) !important; color: var(--muted) !important; border-style: dashed; }
.elemento.juego-oculto .sim { font-size: 1.3rem; color: var(--texto); }
.elemento.juego-oculto .nom { display: none; }
.elemento.acertada { outline: 3px solid #22c55e; }
.elemento.fallo { outline: 3px solid #ef4444; animation: shake 0.35s; }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.juego-zona { margin-top: 1rem; display: grid; gap: 0.6rem; }
.juego-pista { margin: 0; color: var(--texto); background: #0f172a; border-radius: 10px; padding: 0.6rem; font-size: 0.9rem; }
.juego-zona input { background: #0f172a; color: var(--texto); border: 1px solid #475569; border-radius: 8px; padding: 0.6rem 0.8rem; width: 100%; font-size: 1rem; }
.juego-zona input:focus { outline: 2px solid var(--acento); border-color: var(--acento); }
.juego-acciones { display: flex; gap: 0.5rem; }
.juego-acciones button { background: var(--acento); color: #082f49; font-weight: 700; border: none; border-radius: 8px; padding: 0.6rem 1rem; cursor: pointer; }
.juego-mensaje { margin: 0; min-height: 1.2em; font-size: 0.9rem; }
.juego-mensaje.ok { color: #22c55e; }
.juego-mensaje.ko { color: #ef4444; }
@media (max-width: 900px) {
  .tabla { grid-template-columns: repeat(18, 56px); }
  .fila-elementos { grid-template-columns: repeat(15, 56px); overflow-x: auto; }
  .detalle-lista { grid-template-columns: 1fr; }
}

</style>
</head>

      <div class="lang-wrap">

          <option value="en">English</option>
        </select>
      </div>
    </div>
  </header>

  <section class="controls">
    <input id="buscador" type="search" data-i18n-ph="search" placeholder="Buscar por nombre, símbolo o número…" autocomplete="off" />
    <select id="filtroFamilia" aria-label="Familia"></select>
    <select id="filtroEstado" aria-label="Estado"></select>
    <button id="limpiar" data-i18n="clear">Limpiar</button>
    <span id="contador" class="contador"></span>
  </section>

  <section id="gameBar" class="game-bar oculto" aria-live="polite">
    <span id="gScore" class="g-score"></span>
    <span id="gIntentos" class="g-score"></span>
    <span id="gPrecision" class="g-score"></span>
    <button id="reiniciarJuego" data-i18n="restart">Reiniciar</button>
    <button id="revelarTodo" data-i18n="giveUp">Rendirse</button>
  </section>

  <section class="leyenda" id="leyenda"></section>

  <main>
    <div id="tabla" class="tabla" role="grid" aria-label="Tabla periódica"></div>
    <div class="bloque-f">
      <div class="fila-f"><span class="etiqueta-f">57–71</span><div id="lantanidos" class="fila-elementos"></div></div>
      <div class="fila-f"><span class="etiqueta-f">89–103</span><div id="actinidos" class="fila-elementos"></div></div>
    </div>
  </main>

  <div id="modal" class="modal oculto" role="dialog" aria-modal="true">
    <div class="tarjeta-detalle">
      <button id="cerrar" class="cerrar" aria-label="Cerrar">✕</button>
      <div class="detalle-head">
        <div id="dSimbolo" class="d-simbolo">H</div>

      </div>
      <dl class="detalle-lista" id="detalleLista">
        <div><dt data-i18n="masa">Masa atómica</dt><dd id="dMasa"></dd></div>
        <div><dt data-i18n="estado">Estado</dt><dd id="dEstado"></dd></div>
        <div><dt data-i18n="grupo">Grupo / Periodo</dt><dd id="dGrupo"></dd></div>
        <div class="ancho"><dt>💡 <span data-i18n="uso">Usos y curiosidades</span></dt><dd id="dUso"></dd><dd id="dCur" class="d-cur"></dd><a id="dWiki" class="d-wiki" target="_blank" rel="noopener">Wikipedia ↗</a></div>
      </dl>
      <div id="juegoZona" class="juego-zona oculto">
        <p id="juegoPista" class="juego-pista"></p>
        <input id="adivinanza" type="text" data-i18n-ph="guessPh" placeholder="Escribe símbolo o nombre…" autocomplete="off" />
        <div class="juego-acciones">
          <button id="comprobar" data-i18n="check">Comprobar</button>
        </div>
        <p id="mensajeJuego" class="juego-mensaje" aria-live="polite"></p>
      </div>
    </div>
  </div>

let datos = [];
let lang = localStorage.getItem("tp-lang") || "es";
let gameMode = false;
let acertados = new Set();
let intentosJuego = 0;
let elementoActual = null;
const $ = id => document.getElementById(id);
const T = () => TEXTOS[lang];
const nombre = e => lang === "es" ? e.nombre_es : e.nombre_en;

function aplicarTextos() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const k = el.dataset.i18n;
    if (T()[k] && typeof T()[k] === "string") el.textContent = T()[k];
  });
  $("buscador").placeholder = T().search;
  $("lang").value = lang;
  const dw = $("dWiki");
  if (dw) dw.textContent = T().wiki + " ↗";
  const adv = $("adivinanza");
  if (adv) adv.placeholder = T().guessPh;
  construirFiltros();
  construirLeyenda();
  actualizarContador(datos.filter(visible).length);
  actualizarScore();
  if (elementoActual && gameMode) $("juegoPista").textContent = T().pista(elementoActual);
}

function construirFiltros() {
  const fc = $("filtroFamilia"), fe = $("filtroEstado");
  const vc = fc.value || "", ve = fe.value || "";
  fc.innerHTML = `<option value="">${T().todasFam}</option>` +
    Object.entries(T().familias).map(([k,v]) => `<option value="${k}">${v}</option>`).join("");
  fe.innerHTML = `<option value="">${T().todosEst}</option>` +
    Object.entries(T().estados).map(([k,v]) => `<option value="${k}">${v}</option>`).join("");
  if ([...fc.options].some(o => o.value === vc)) fc.value = vc;
  if ([...fe.options].some(o => o.value === ve)) fe.value = ve;
}

function construirLeyenda() {
  $("leyenda").innerHTML = Object.entries(T().familias).map(([k,v]) =>
    `<button class="chip fam-${k.replace(/-/g,"-")}" data-fam="${k}">${v}</button>`).join("");
  document.querySelectorAll("#leyenda .chip").forEach(ch => {
    ch.onclick = () => {
      $("filtroFamilia").value = $("filtroFamilia").value === ch.dataset.fam ? "" : ch.dataset.fam;
      filtrar();
    };
  });
}

function tarjeta(e) {
  const d = document.createElement("button");
  const adivinado = acertados.has(e.numero);
  d.className = `elemento fam-${e.familia}` + (gameMode && !adivinado ? " juego-oculto" : "") + (gameMode && adivinado ? " acertada" : "");
  d.style.gridColumn = e.grupo;
  d.style.gridRow = e.periodo;
  d.setAttribute("role", "gridcell");
  d.tabIndex = 0;
  d.dataset.numero = e.numero;
  if (gameMode && !adivinado) {
    d.innerHTML = `<span class="num">${e.numero}</span><span class="sim">?</span>`;
  } else {
    d.innerHTML = `<span class="num">${e.numero}</span><span class="sim">${e.simbolo}</span><span class="nom">${nombre(e)}</span>`;
  }
  d.onclick = () => mostrar(e);
  d.onkeydown = ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); mostrar(e); } };
  return d;
}

function render() {
  const tabla = $("tabla"), lan = $("lantanidos"), act = $("actinidos");
  tabla.innerHTML = ""; lan.innerHTML = ""; act.innerHTML = "";
  datos.forEach(e => {
    const esF = e.familia === "lantanido" || e.familia === "actinido";
    const t = tarjeta(e);
    if (!esF) { t.style.gridColumn = e.grupo; t.style.gridRow = e.periodo; tabla.appendChild(t); }
    else { t.style.gridColumn = ""; t.style.gridRow = ""; (e.familia === "lantanido" ? lan : act).appendChild(t); }
  });
  // Marcadores de hueco La-Lu y Ac-Lr en la tabla principal
  const hueco1 = document.createElement("div");
  hueco1.className = "elemento fam-lantanido";
  hueco1.style.gridColumn = 3; hueco1.style.gridRow = 6;
  hueco1.innerHTML = `<span class="sim">57–71</span><span class="nom">La–Lu</span>`;
  hueco1.onclick = () => document.querySelector(".bloque-f").scrollIntoView({behavior:"smooth"});
  const hueco2 = hueco1.cloneNode(true);
  hueco2.className = "elemento fam-actinido";
  hueco2.style.gridRow = 7;
  hueco2.innerHTML = `<span class="sim">89–103</span><span class="nom">Ac–Lr</span>`;
  hueco2.onclick = hueco1.onclick;
  tabla.appendChild(hueco1); tabla.appendChild(hueco2);
  filtrar();
}

function visible(e) {
  const q = $("buscador").value.trim().toLowerCase();
  const c = $("filtroFamilia").value, s = $("filtroEstado").value;
  if (c && e.familia !== c) return false;
  if (s && e.estado !== s) return false;
  if (q && !(e.nombre_es.toLowerCase().includes(q) || e.nombre_en.toLowerCase().includes(q) ||
    e.simbolo.toLowerCase() === q || String(e.numero) === q)) return false;
  return true;
}

function filtrar() {
  if (gameMode) {
    document.querySelectorAll(".elemento[data-numero]").forEach(el => el.classList.remove("atenuado"));
    return;
  }
  let n = 0;
  document.querySelectorAll(".elemento[data-numero]").forEach(el => {
    const e = datos.find(x => x.numero === +el.dataset.numero);
    const ok = visible(e);
    el.classList.toggle("atenuado", !ok);
    if (ok) n++;
  });
  actualizarContador(n);
}

function actualizarContador(n) { $("contador").textContent = T().contador(n); }

function mostrar(e) {
  if (gameMode && !acertados.has(e.numero)) { mostrarPregunta(e); return; }
  $("detalleLista").classList.remove("oculto");
  $("juegoZona").classList.add("oculto");  document.querySelectorAll(".elemento.seleccionado").forEach(x => x.classList.remove("seleccionado"));
  document.querySelector(`.elemento[data-numero="${e.numero}"]`)?.classList.add("seleccionado");
  $("dSimbolo").textContent = e.simbolo;
  $("dSimbolo").className = `d-simbolo fam-${e.familia}`;
  $("dNumero").textContent = "#" + e.numero;
  $("dNombre").textContent = nombre(e);
  $("dFamilia").textContent = T().familias[e.familia];
  $("dMasa").textContent = e.masa + " u";
  $("dEstado").textContent = T().estados[e.estado];
  $("dGrupo").textContent = lang === "es" ? `Grupo ${e.grupo}, Periodo ${e.periodo}` : `Group ${e.grupo}, Period ${e.periodo}`;
  $("dUso").textContent = lang === "es" ? e.uso_es : e.uso_en;
  $("dCur").textContent = lang === "es" ? e.curiosidad_es : e.curiosidad_en;
  const wiki = $("dWiki");
  if (wiki) {
    const wname = lang === "es" ? e.nombre_es : e.nombre_en;
    const base = lang === "es" ? "https://es.wikipedia.org/wiki/" : "https://en.wikipedia.org/wiki/";
    wiki.href = base + encodeURIComponent(wname);
    wiki.textContent = T().wiki + " ↗";
  }
  $("modal").classList.remove("oculto");
}

function normaliza(s) {
  return (s || "").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

function totalElementos() { return datos.length || 118; }

function actualizarScore() {
  const total = totalElementos();
  const ok = acertados.size;
  const prec = intentosJuego > 0 ? Math.round((ok / intentosJuego) * 100) : 0;
  if ($("gScore")) $("gScore").textContent = `${T().scoreLabel}: ${ok} / ${total}`;
  if ($("gIntentos")) $("gIntentos").textContent = `${T().attemptsLabel}: ${intentosJuego}`;
  if ($("gPrecision")) $("gPrecision").textContent = `${T().accuracyLabel}: ${prec} %`;
}

function iniciarJuego() {
  gameMode = true;
  document.body.classList.add("game-on");
  $("gameBar").classList.remove("oculto");
  $("modal").classList.add("oculto");
  elementoActual = null;
  render();
  actualizarScore();
}

function salirJuego() {
  gameMode = false;
  document.body.classList.remove("game-on");
  $("gameBar").classList.add("oculto");
  $("modal").classList.add("oculto");
  elementoActual = null;
  render();
}

function reiniciarJuego() {
  acertados = new Set();
  intentosJuego = 0;
  elementoActual = null;
  $("modal").classList.add("oculto");
  render();
  actualizarScore();
}

function revelarTodo() {
  datos.forEach(e => acertados.add(e.numero));
  elementoActual = null;
  $("modal").classList.add("oculto");
  render();
  actualizarScore();
}

function revelarCasilla(numero) {
  const el = document.querySelector(`.elemento[data-numero="${numero}"]`);
  const e = datos.find(x => x.numero === numero);
  if (!el || !e) return;
  el.classList.remove("juego-oculto");
  el.classList.add("acertada");
  el.innerHTML = `<span class="num">${e.numero}</span><span class="sim">${e.simbolo}</span><span class="nom">${nombre(e)}</span>`;
}

function mostrarPregunta(e) {
  elementoActual = e;
  document.querySelectorAll(".elemento.seleccionado").forEach(x => x.classList.remove("seleccionado"));
  document.querySelector(`.elemento[data-numero="${e.numero}"]`)?.classList.add("seleccionado");
  $("dSimbolo").textContent = "?";
  $("dSimbolo").className = "d-simbolo";
  $("dNumero").textContent = "#" + e.numero;
  $("dNombre").textContent = T().guessTitle;
  $("dFamilia").textContent = "";
  $("detalleLista").classList.add("oculto");
  $("juegoZona").classList.remove("oculto");
  $("juegoPista").textContent = T().pista(e);
  $("adivinanza").value = "";
  const m = $("mensajeJuego");
  m.textContent = "";
  m.className = "juego-mensaje";
  $("modal").classList.remove("oculto");
  setTimeout(() => $("adivinanza").focus(), 50);
}

function comprobarIntento() {
  if (!elementoActual || !gameMode) return;
  const val = normaliza($("adivinanza").value);
  if (!val) return;
  const e = elementoActual;
  const ok = val === normaliza(e.simbolo) || val === normaliza(e.nombre_es) || val === normaliza(e.nombre_en);
  intentosJuego++;
  const m = $("mensajeJuego");
  const el = document.querySelector(`.elemento[data-numero="${e.numero}"]`);
  if (ok) {
    acertados.add(e.numero);
    revelarCasilla(e.numero);
    m.textContent = T().correct + (acertados.size === totalElementos() ? " " + T().win : "");
    m.className = "juego-mensaje ok";
    actualizarScore();
    elementoActual = null;
    setTimeout(() => { if (!elementoActual) $("modal").classList.add("oculto"); }, 900);
  } else {
    m.textContent = T().wrong;
    m.className = "juego-mensaje ko";
    if (el) {
      el.classList.add("fallo");
      setTimeout(() => el.classList.remove("fallo"), 600);
    }
    actualizarScore();
  }
}

function init() {
  $("lang").value = lang;
  $("lang").onchange = e => { lang = e.target.value; localStorage.setItem("tp-lang", lang); aplicarTextos(); render(); };
  $("buscador").oninput = filtrar;
  $("filtroFamilia").onchange = filtrar;
  $("filtroEstado").onchange = filtrar;
  $("limpiar").onclick = () => { $("buscador").value = ""; $("filtroFamilia").value = ""; $("filtroEstado").value = ""; filtrar(); };
  $("cerrar").onclick = () => { $("modal").classList.add("oculto"); elementoActual = null; };
  $("modal").addEventListener("click", e => { if (e.target.id === "modal") { $("modal").classList.add("oculto"); elementoActual = null; } });
  document.addEventListener("keydown", e => { if (e.key === "Escape") { $("modal").classList.add("oculto"); elementoActual = null; } });
  $("modoJuego").onchange = e => { e.target.checked ? iniciarJuego() : salirJuego(); };
  $("reiniciarJuego").onclick = reiniciarJuego;
  $("revelarTodo").onclick = revelarTodo;
  $("comprobar").onclick = comprobarIntento;
  $("adivinanza").addEventListener("keydown", e => { if (e.key === "Enter") comprobarIntento(); });

  datos = DATOS_EMBEBIDOS;
  aplicarTextos();
  render();
}
init();

</script>
</body>
</html>
